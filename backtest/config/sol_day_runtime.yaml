# SOL Day v3 — Runtime config
# PHASE: paper test at $2,000 so both desks share the same book size.
# Formula is unchanged: ChoCh + first FVG ≥ 0.6×ATR, 3R/4R, Quarter-Kelly 4.5%.

symbol: SOLUSDT
timeframe: 15m
poll_seconds: 120

# Risk — paper book $2,000 (not a formula change)
equity_unit_usd: 2000
kelly_fraction: 0.045          # Quarter-Kelly → $90 risk / trade
max_risk_pct: 0.05             # hard cap $100
daily_loss_limit_pct: 0.08     # halt after -$160 day (Chicago date)

# Formula
fvg_min_atr_multiple: 0.60
min_rr: 3.0
prefer_rr: 4.0
signal_fresh_minutes: 90
max_entry_distance_r: 1.25
one_trade_at_a_time: true

# Session preference (America/Chicago)
session:
  timezone: America/Chicago
  open_only_during_session: false
  start: "08:00"
  end: "15:00"

paths:
  kill_switch: data/KILL_SWITCH.txt
  open_trades: data/sol_day_open_trades.json
  closed_trades: data/sol_day_paper_trades.jsonl
  latest_signal: data/sol_day_latest_signal.json
  daily_state: data/sol_day_daily_state.json
