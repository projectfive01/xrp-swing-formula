# SOL Day backtest / live parameters — v3 LOCKED 2026-08-25
# Simplified high-RR system + Quarter-Kelly sizing

symbol: SOLUSDT
timeframe: 15m          # primary; 5m ATR still used for FVG size checks

# Hard filters only (no Quality Score gate)
require_choch: true
require_first_fvg_after_choch: true
fvg_min_atr_multiple: 0.60

atr:
  period: 14
  method: wilder

risk:
  model: quarter_kelly
  kelly_fraction: 0.25          # Quarter-Kelly of full f*
  fallback_pct_equity: 0.045    # ~4.5% when edge not yet recalculated
  max_pct_equity: 0.05          # hard cap
  base_unit_usd: 1000           # monthly restart unit
  daily_loss_limit_pct: 0.08

targets:
  min_rr: 3.0
  preferred_rr: 4.0
  primary_exit: opposite_choch_or_rr

session:
  timezone: America/Chicago
  preference_start: "08:00"
  preference_end: "13:00"
  # Preference only — not a hard gate

costs:
  fee_bps: 4
  slippage_bps: 2
